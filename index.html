<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LostLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================
         NAVIGATION BAR
    =========================== -->
    <nav>
        <h1>🔎 LostLink</h1>

        <div>
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="lost.html">Report</a>

            <!-- This link changes automatically
                 when the user logs in -->
            <a href="login.html" id="authLink">Login</a>
        </div>
    </nav>


    <!-- ==========================
         MAIN CONTENT
    =========================== -->
    <main>

        <!-- HERO SECTION -->
        <section class="hero">

            <h2>
                Lost something? We'll help you find it.
            </h2>

            <p>
                Report lost or found items and connect them with their owners.
            </p>

            <input
                type="text"
                placeholder="🔍 Search lost & found items..."
            >

            <div class="hero-buttons">

                <button
                    id="lostButton"
                    type="button"
                >
                    Report Lost Item
                </button>

                <button
                    id="foundButton"
                    type="button"
                >
                    Report Found Item
                </button>

            </div>

        </section>


        <!-- ==========================
             RECENT REPORTS
        =========================== -->
        <section class="recent">

            <h2>Recent Reports</h2>

            <div class="cards">

                <div class="card">

                    <div class="item-icon">
                        🎒
                    </div>

                    <h3>
                        Black Backpack
                    </h3>

                    <p>
                        📍 Library
                    </p>

                    <span>
                        LOST
                    </span>

                </div>


                <div class="card">

                    <div class="item-icon">
                        📱
                    </div>

                    <h3>
                        Smartphone
                    </h3>

                    <p>
                        📍 Block B
                    </p>

                    <span>
                        FOUND
                    </span>

                </div>


                <div class="card">

                    <div class="item-icon">
                        🔑
                    </div>

                    <h3>
                        Key Chain
                    </h3>

                    <p>
                        📍 Canteen
                    </p>

                    <span>
                        LOST
                    </span>

                </div>

            </div>

        </section>

    </main>


    <!-- ==========================
         JAVASCRIPT
    =========================== -->
    <script
        type="module"
        src="script.js"
    ></script>

</body>
</html>
