<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item - LostLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h1>🔎 LostLink</h1>

        <div>
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="lost.html">Report</a>
            <a href="#">Login</a>
        </div>
    </nav>

    <main>

        <section class="form-section">

            <h2>📢 Report a Lost Item</h2>

            <p>Tell us about the item you lost.</p>

            <form id="lostForm">

                <label>Item Name</label>
                <input 
                type="text"
                id ="itemName"
                placeholder="Example: Black Backpack"
                required 
                >
                <label>Category</label>
                <select id="category" required>
                    <option>Select category</option>
                    <option>Electronics</option>
                    <option>Bags</option>
                    <option>Books</option>
                    <option>Keys</option>
                    <option>ID / Cards</option>
                    <option>Clothing</option>
                    <option>Other</option>
                </select>

                <label>Description</label>
                <textarea
                id="description"
                placeholder="Describe the item..."
                required 
                ></textarea>

                <label>Where did you lose it?</label>
                <input 
                type="text"
                id="location"
                placeholder="Example: Library"
                required
                >

                <label>Date</label>
                <input type="date" id="date" required>

                <label>Approximate Time</label>
                <input type="time" id="time" required>

                <button type="submit">Submit Lost Report</button>

            </form>

        </section>

    </main>
    <script type="module" src="script.js"></script>


</body>

</html>
